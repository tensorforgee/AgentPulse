name: agentpulse

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - ingress

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: ["pnpm", "--dir", "apps/api", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGINS: "https://${WEB_DOMAIN:?Set WEB_DOMAIN}"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      ALERT_WEBHOOK_URLS_JSON: "${ALERT_WEBHOOK_URLS_JSON:-{}}"
      RCA_PROVIDER_API_KEY: ${RCA_PROVIDER_API_KEY:-}
      RCA_PROVIDER_MODEL: ${RCA_PROVIDER_MODEL:-}
      RCA_PROVIDER_BASE_URL: ${RCA_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      RATE_LIMIT_AUTH_SIGNUP_MAX: "${RATE_LIMIT_AUTH_SIGNUP_MAX:-5}"
      RATE_LIMIT_AUTH_LOGIN_MAX: "${RATE_LIMIT_AUTH_LOGIN_MAX:-10}"
      RATE_LIMIT_AUTH_REFRESH_MAX: "${RATE_LIMIT_AUTH_REFRESH_MAX:-30}"
      RATE_LIMIT_AUTH_WINDOW_MS: "${RATE_LIMIT_AUTH_WINDOW_MS:-60000}"
      RATE_LIMIT_API_KEY_INVALID_MAX: "${RATE_LIMIT_API_KEY_INVALID_MAX:-30}"
      RATE_LIMIT_API_KEY_INVALID_WINDOW_MS: "${RATE_LIMIT_API_KEY_INVALID_WINDOW_MS:-60000}"
      RATE_LIMIT_INGEST_MAX: "${RATE_LIMIT_INGEST_MAX:-600}"
      RATE_LIMIT_INGEST_WINDOW_MS: "${RATE_LIMIT_INGEST_WINDOW_MS:-60000}"
      RATE_LIMIT_RCA_MAX: "${RATE_LIMIT_RCA_MAX:-10}"
      RATE_LIMIT_RCA_WINDOW_MS: "${RATE_LIMIT_RCA_WINDOW_MS:-60000}"
      RATE_LIMIT_MAX_BUCKETS: "${RATE_LIMIT_MAX_BUCKETS:-10000}"
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ingress
      - data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AGENTPULSE_API_URL: http://api:5000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ingress

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  ingress:
  data:
    internal: true
